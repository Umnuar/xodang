<section id="contribute" class="container" aria-label="Khu vực đóng góp từ vựng Xơ Đăng">
    <header class="contribute-header">
        <h1>Đóng Góp Từ Vựng Tiếng Xơ Đăng</h1>
        <p class="contribute-subtitle">Chung tay làm giàu kho ngữ liệu Xơ Đăng bằng từ vựng mới và bản thu âm giọng đọc bản địa chuẩn xác.</p>
    </header>
    
    <div class="contribute-tabs" role="tablist" aria-label="Chế độ đóng góp">
        <button class="contribute-tab active" data-tab="single" role="tab" aria-selected="true">Từ đơn</button>
        <button class="contribute-tab" data-tab="batch" role="tab" aria-selected="false">Thu hàng loạt</button>
    </div>
    
    <!-- Tab Từ đơn -->
    <div id="singleTab" class="contribute-form" role="tabpanel" aria-label="Đóng góp từng từ đơn lẻ">
        <div class="form-group">
            <label for="vietnameseWord">Từ tiếng Việt <span class="required-mark">*</span></label>
            <input type="text" id="vietnameseWord" class="form-input" placeholder="Ví dụ: Con mèo" autocomplete="off">
        </div>
        
        <div class="form-group">
            <label for="xodangWord">Nghĩa tiếng Xơ Đăng <span class="required-mark">*</span></label>
            <input type="text" id="xodangWord" class="form-input" placeholder="Ví dụ: Kon meo" autocomplete="off">
        </div>
        
        <div class="form-group">
            <label>Bản thu âm phát âm <span class="required-mark">*</span></label>
            <div class="audio-controls">
                <button id="recordAudioBtn" class="audio-btn record-btn" type="button">
                    <svg class="lucide-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>
                    </svg>
                    <span class="btn-text">Thu âm</span>
                </button>
                <button id="uploadAudioBtn" class="audio-btn upload-btn" type="button">
                    <svg class="lucide-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>
                    </svg>
                    <span class="btn-text">Tải file lên</span>
                </button>
                <input type="file" id="audioFileInput" accept="audio/*" style="display: none;">
            </div>
            
            <div class="audio-visualizer" id="audioVisualizer" aria-hidden="true">
                <div class="audio-wave" id="audioWave"></div>
            </div>
            
            <div class="single-playback-controls" id="singlePlaybackControls" style="display: none;">
                <button id="singlePlayAudioBtn" class="playback-btn play-btn" type="button" aria-label="Phát lại" title="Nghe lại">
                    <svg class="lucide-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="6 3 20 12 6 21 6 3"/>
                    </svg>
                </button>
                <button id="singleStopAudioBtn" class="playback-btn stop-btn" type="button" aria-label="Dừng" title="Dừng phát">
                    <svg class="lucide-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect width="18" height="18" x="3" y="3" rx="2"/>
                    </svg>
                </button>
                <button id="singleDeleteAudioBtn" class="playback-btn delete-btn" type="button" aria-label="Xóa bản thu" title="Xóa bản thu">
                    <svg class="lucide-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>
                    </svg>
                </button>
                <span id="singleAudioFileName" class="playback-filename"></span>
            </div>
            
            <div class="audio-status" id="audioStatus" role="status" aria-live="polite"></div>
        </div>
        
        <button id="submitSingleBtn" class="submit-contribute-btn" type="button">
            <svg class="lucide-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
            <span>Gửi từ vựng</span>
        </button>
    </div>
    
    <!-- Tab Thu hàng loạt -->
    <div id="batchTab" class="contribute-form" role="tabpanel" aria-label="Thu âm nhiều từ vựng liên tục" style="display: none;">
        <div class="form-group">
            <label>Thu âm hàng loạt danh sách</label>
            <div class="audio-controls">
                <button id="recordBatchBtn" class="audio-btn record-btn" type="button">
                    <svg class="lucide-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>
                    </svg>
                    <span class="btn-text">Bắt đầu thu</span>
                </button>
                <button id="uploadBatchBtn" class="audio-btn upload-btn" type="button">
                    <svg class="lucide-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>
                    </svg>
                    <span class="btn-text">Tải nhiều file</span>
                </button>
                <input type="file" id="batchAudioInput" accept="audio/*" multiple style="display: none;">
            </div>
            
            <div class="audio-visualizer" id="batchVisualizer" aria-hidden="true">
                <div class="audio-wave" id="batchWave"></div>
            </div>
            
            <div class="audio-status" id="batchStatus" role="status" aria-live="polite">Chưa có file nào trong hàng đợi</div>
            
            <div class="queue-list" id="batchQueueList" style="display: none;">
                <!-- Các file trong hàng đợi sẽ hiển thị ở đây qua Event Delegation -->
            </div>
        </div>
        
        <button id="submitBatchBtn" class="submit-contribute-btn" type="button">
            <svg class="lucide-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
            <span>Gửi tất cả</span>
        </button>
    </div>

    <!-- Hộp thoại xác nhận xóa bản thu (1 bước duy nhất, nút 'Xóa') -->
    <div id="deleteAudioConfirmModal" class="contribute-modal-overlay" style="display: none;">
        <div class="contribute-modal-card" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
            <h3 id="deleteModalTitle">Xóa bản thu này?</h3>
            <p id="deleteModalDesc">Bản thu hiện tại sẽ bị xóa bỏ. Bạn có thể thu âm lại hoặc tải tệp khác lên.</p>
            <div class="contribute-modal-actions">
                <button id="btnCancelDeleteAudio" class="modal-btn btn-secondary" type="button">Hủy</button>
                <button id="btnConfirmDeleteAudio" class="modal-btn btn-danger" type="button">Xóa</button>
            </div>
        </div>
    </div>
</section>
